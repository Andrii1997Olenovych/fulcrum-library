<section class="intro">
  <div>
    <h1>Library</h1>
  </div>
  <div class="file-actions">
    <label class="visually-hidden" for="library-file">Import XML file</label>
    <input
      #fileInput
      id="library-file"
      class="visually-hidden"
      type="file"
      accept=".xml,application/xml,text/xml"
      tabindex="-1"
      [disabled]="importing()"
      (change)="selectFile(fileInput)"
    />
    <button class="button" type="button" [disabled]="importing()" (click)="fileInput.click()">
      <span class="import-icon" [class.is-loading]="importing()">{{ importing() ? '' : '↓' }}</span>
      {{ importing() ? 'Importing…' : 'Import XML' }}
    </button>
    <button
      class="button"
      type="button"
      [disabled]="importing() || empty()"
      (click)="exportRequested.emit()"
    >
      <span>↑</span> Export XML
    </button>
  </div>
</section>
